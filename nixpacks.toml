# ffmpeg для сторінки завантаження відео (handlers/video_download.py).
#
# Навіщо: високі якості на YouTube лежать окремо відео й окремо звук — склеїти
# їх може лише ffmpeg. Заміряно на живому форматному списку (data/
# video_formats_sample.json, 14.08.2026): з ffmpeg сторінка пропонує
# 2160p/1440p/1080p/720p/480p/360p, без нього — рівно 360p, бо одним файлом на
# YouTube лежить тільки він.
#
# Файл ДОДАЄ пакет, а не переписує збірку: nixPkgs тут не чіпаються, тож
# автовизначення Python лишається як було. Якщо збірка колись почне
# вередувати — видалення цього файлу повертає її рівно в попередній стан, а
# сторінка й далі працює, лише з коротшим списком якостей (вона перевіряє
# наявність ffmpeg сама і чесно про це підписує). Альтернатива без файлу —
# змінна NIXPACKS_APT_PKGS=ffmpeg у Railway.

[phases.setup]
aptPkgs = ["ffmpeg"]
