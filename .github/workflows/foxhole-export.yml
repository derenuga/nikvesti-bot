# Службовий workflow вигрузки статей з нори для скіла deep-dossier.
# Раннер має відкриту мережу до Railway (пісочниця Claude Code — ні).
#
# КЛЮЧ ЖИВЕ В СЕКРЕТІ РЕПО, а не у файлі. Раніше публічний URL нори (це живий
# пароль до бази з 17-річним архівом) вписувався в dossier_export/REQUEST,
# комітився й лишався в історії назавжди — тож ритуал «ротувати після прогону»
# був не обережністю, а обов'язком, і тримався на памʼяті людини. Тепер URL
# лежить у секреті FOXHOLE_DB_URL, у git не потрапляє ніколи й ротації не
# потребує.
#
# Завести секрет (один раз, Олег):
#   Settings → Secrets and variables → Actions → New repository secret
#   Ім'я: FOXHOLE_DB_URL
#   Значення: DATABASE_PUBLIC_URL з Railway (Postgres → Variables)
#
# Тригер: пуш файлу dossier_export/REQUEST у будь-яку гілку. У ньому лишається
# тільки те, що не є таємницею:
#   TSQUERY=Кім:* | Ким:*
#   OUT_PREFIX=dossier_export/topic  # опційно
#
# Або workflow_dispatch із тими самими двома полями — інпута під ключ немає
# свідомо: він потрапляв би в логи прогону.
name: foxhole-export

on:
  push:
    branches: ["**"]
    paths: [dossier_export/REQUEST]
  workflow_dispatch:
    inputs:
      tsquery:
        description: "to_tsquery('simple', ...) вираз"
        required: true
      out_prefix:
        description: "Префікс вихідних файлів"
        required: false
        default: dossier_export/topic

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install psycopg2-binary
      - name: Export from foxhole
        env:
          SECRET_DBURL: ${{ secrets.FOXHOLE_DB_URL }}
          IN_TSQUERY: ${{ github.event.inputs.tsquery }}
          IN_PREFIX: ${{ github.event.inputs.out_prefix }}
        run: |
          if [ -f dossier_export/REQUEST ]; then set -a; . dossier_export/REQUEST; set +a; fi
          # Секрет — головне джерело. DB_URL із REQUEST лишається прийнятним
          # лише як пережиток старого шляху: працюємо, але кажемо вголос, що
          # ключ уже в історії й потребує ротації.
          if [ -n "$SECRET_DBURL" ]; then
            export FOXHOLE_DB_URL="$SECRET_DBURL"
          elif [ -n "$DB_URL" ]; then
            export FOXHOLE_DB_URL="$DB_URL"
            echo "::warning::DB_URL узято з файла REQUEST — він потрапив у git."
            echo "::warning::Заведи секрет FOXHOLE_DB_URL і ротуй цей URL."
          fi
          export TOPIC_TSQUERY="${TSQUERY:-$IN_TSQUERY}"
          export OUT_PREFIX="${OUT_PREFIX:-${IN_PREFIX:-dossier_export/topic}}"
          if [ -z "$FOXHOLE_DB_URL" ]; then
            echo "::error::Немає доступу до нори. Заведи секрет FOXHOLE_DB_URL:"
            echo "::error::Settings → Secrets and variables → Actions →"
            echo "::error::New repository secret, значення — DATABASE_PUBLIC_URL з Railway."
            exit 1
          fi
          test -n "$TOPIC_TSQUERY" || { echo "::error::немає TSQUERY"; exit 1; }
          mkdir -p "$(dirname "$OUT_PREFIX")"
          python scripts/dossier/export_foxhole.py
      - name: Commit export
        run: |
          git config user.name "foxhole-export"
          git config user.email "actions@github.com"
          git add dossier_export/topic* dossier_export/*.ndjson.gz dossier_export/*_index.tsv 2>/dev/null || true
          git add -A dossier_export/
          git commit -m "foxhole export" || { echo "нічого комітити"; exit 0; }
          git push
