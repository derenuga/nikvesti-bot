# Автоматичний прогін перевірок на кожен пуш і кожен PR.
#
# Навіщо: тестів у репо чотири десятки, але запускати їх доводилось руками по
# одному, тому їх не ганяв ніхто — і за пів місяця шість перевірок Mini App
# розійшлись із самою апкою мовчки (скасований колір кільця, протухла по
# календарю дата, три екрани, що переїхали). Тепер це видно на PR до мерджу
# в main, а не через місяць.
#
# Пастка, заради якої тут є окремий крок «переконатись, що браузер є»:
# webapp-тести при відсутньому playwright ЗАВЖДИ виходили з кодом 0 і словами
# «тест пропущено». Без явної перевірки цей workflow був би вічнозеленим і не
# перевіряв би жодного екрана апки — тобто гірше, ніж його відсутність.
#
# Живих доступів тут немає й не буде (нора, токен Facebook) — тести, яким
# вони потрібні, друкуються окремим списком «не запускались» із причиною.
# Прогнати їх можна локально, задавши BOT_DATABASE_URL.
name: tests

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

# Новий пуш у ту саму гілку скасовує попередній прогін: чекати на результат
# застарілого коду ні до чого
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Залежності бота
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Playwright
        run: pip install playwright

      # Сам браузер (~150 МБ) кешується за версією playwright: качати його
      # щоразу — це хвилини на кожен пуш заради байт-у-байт того самого файла
      - name: Версія playwright для ключа кешу
        id: pw
        run: echo "v=$(python -c 'import importlib.metadata as m; print(m.version(\"playwright\"))')" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.v }}-chromium

      - name: Браузер для тестів Mini App
        if: steps.pw-cache.outputs.cache-hit != 'true'
        # БЕЗ --with-deps свідомо: на ubuntu-latest потрібні для chromium
        # бібліотеки вже стоять, а apt-крок у першому ж прогоні завис на
        # чверть години й зʼїв би весь бюджет job'а. Якщо колись у образі
        # раннера чогось забракне — це не сховається: наступний крок
        # запускає браузер по-справжньому і впаде з назвою бібліотеки.
        timeout-minutes: 8
        run: playwright install chromium

      - name: Переконатись, що браузер справді є
        # Без цього кроку тести апки мовчки «пропустились» би, а прогін
        # лишився зеленим — саме та дірка, від якої ми тут і лікуємось
        timeout-minutes: 3
        run: |
          python - <<'PY'
          import sys
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              print("chromium", b.version)
              b.close()
          PY

      - name: Прогін
        run: python scripts/run_tests.py
