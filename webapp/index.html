<!doctype html>
<html lang="uk">
<head>

<link rel="stylesheet" href="/static/style.css">

<body>

  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2 4.2 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7A2 2 0 0 1 22 16.9z"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></symbol>
  <!-- Знаки мереж: спрощені монохромні глифи (stroke=currentColor), як решта
       спрайта. Не офіційні лого — їх не можна тягнути з CDN (CSP + офлайн),
       а PNG у base64 роздули б статику; форма тут несе впізнаваність, колір
       дає бренд-відтінок у CSS. -->
  <symbol id="i-facebook" viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></symbol>

  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></symbol>
  <symbol id="i-award" viewBox="0 0 24 24"><circle cx="12" cy="8" r="7"/><polyline points="8.2 13.9 7 23 12 20 17 23 15.8 13.9"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
</svg>

<div id="app">
  <div id="screen-loading" class="center-screen">
    <div class="pulse-dot"></div>
    <p>Завантаження…</p>
  </div>

  <div id="screen-error" class="center-screen hidden">
    <h2 id="error-title">Не вдалося</h2>
    <p id="error-text"></p>
    <button id="error-retry" class="cta hidden">Спробувати ще</button>
  </div>

  <div id="screen-main" class="hidden">
    <main id="content"></main>
    <nav id="bottomnav" class="hidden">
      <button class="bn" data-view="home"><svg class="ic"><use href="#i-home"/></svg><span>Головна</span></button>
      <button class="bn" data-view="projects"><svg class="ic"><use href="#i-folder"/></svg><span>Проєкти</span></button>
      <button class="bn-plus" data-view="people" aria-label="Нове завдання"><svg class="ic"><use href="#i-plus"/></svg></button>
      <button class="bn" data-view="reports"><svg class="ic"><use href="#i-file-text"/></svg><span>Звітність</span></button>
      <button class="bn" data-view="alerts"><svg class="ic"><use href="#i-bell"/></svg><span>Сповіщення</span></button>
    </nav>
  </div>

  <div id="sheet-backdrop" class="backdrop hidden"><div id="sheet" class="sheet"></div></div>
  <div id="toast" class="toast hidden"></div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
